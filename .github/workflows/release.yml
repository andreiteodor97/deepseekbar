name: Release

# Cut a release by bumping VERSION, committing, then pushing a matching tag:
#
#   echo 2.0.1 > VERSION && git commit -am "release 2.0.1"
#   git tag v2.0.1 && git push origin main --tags
#
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match VERSION ($FILE_VERSION)" >&2
              exit 1
            fi
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $FILE_VERSION"

      - name: Test
        run: ./test.sh

      - name: Package
        env:
          DEEPSEEKBAR_REPO: ${{ github.repository }}
        run: ./tools/package.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeekBar ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/DeepSeekBar-${{ steps.version.outputs.version }}.zip
            dist/DeepSeekBar-${{ steps.version.outputs.version }}.dmg
            dist/checksums.txt
          body: |
            ## Install

            **Download** `DeepSeekBar-${{ steps.version.outputs.version }}.zip`, unzip, and drag
            `DeepSeekBar.app` to Applications.

            The app is not notarized, so macOS may block the first launch. Either
            right-click the app and choose **Open**, or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/DeepSeekBar.app
            ```

            **Homebrew:**

            ```sh
            brew install --cask https://github.com/${{ github.repository }}/raw/main/Casks/DeepSeekBar.rb
            ```

            **From source** (no Gatekeeper prompts at all):

            ```sh
            git clone https://github.com/${{ github.repository }}.git
            cd deepseekbar && make run
            ```

            Requires macOS 13 or later. Verify downloads against `checksums.txt`.

      # The zip is not byte-for-byte reproducible, so the sha256 baked into the
      # committed cask would go stale on every release. Rewrite it from the artifact
      # that was actually published and commit that.
      #
      # The comparison is done on the checksum itself rather than with `git diff`,
      # which reported "no change" here even when the file on disk had been rewritten.
      - name: Update Homebrew cask
        env:
          DEEPSEEKBAR_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          PUBLISHED="$(cut -d' ' -f1 < "dist/DeepSeekBar-$VERSION.zip.sha256")"
          COMMITTED="$(grep -oE '[0-9a-f]{64}' Casks/DeepSeekBar.rb | head -1 || true)"

          echo "published: $PUBLISHED"
          echo "committed: $COMMITTED"

          if [ "$PUBLISHED" = "$COMMITTED" ]; then
            echo "cask already matches the published artifact"
            exit 0
          fi

          cp "dist/DeepSeekBar.rb" Casks/DeepSeekBar.rb
          test "$(grep -oE '[0-9a-f]{64}' Casks/DeepSeekBar.rb | head -1)" = "$PUBLISHED"
          ruby -c Casks/DeepSeekBar.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/DeepSeekBar.rb
          git commit -m "Update Homebrew cask for v$VERSION [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "cask updated to $PUBLISHED"
